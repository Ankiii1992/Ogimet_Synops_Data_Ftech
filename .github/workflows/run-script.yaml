name: 1.5-Hour Weather Sync Automation

on:
  schedule:
    # Schedule A: Runs at Minute 35 on these UTC hours (Matches 12:05, 3:05, 6:05... IST)
    - cron: '35 0,3,6,9,12,15,18,21 * * *'
    
    # Schedule B: Runs at Minute 05 on these UTC hours (Matches 1:35, 4:35, 7:35... IST)
    - cron: '5 2,5,8,11,14,17,20,23 * * *'
  
  # Keeps the manual button active so you can test it right now
  workflow_dispatch: 

jobs:
  run-weather-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # This creates the physical service_account.json file using your GCP_KEY secret
    - name: Authenticate Google Service Account
      run: |
        echo '${{ secrets.GCP_KEY }}' > service_account.json

    # Executes your script. (Note the quotes to handle spaces in your filename)
    - name: Execute Weather Sync Script
      run: python "3 hourly_data fetch_production_test2.py"
