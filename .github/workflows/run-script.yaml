name: 3 Hour Weather Sync Automation
on:
  workflow_dispatch: # cron-job.org triggers this

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run-weather-sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Authenticate Google Service Account
      run: |
        echo '${{ secrets.GCP_KEY }}' > service_account.json
    - name: Execute Weather Sync Script
      run: python "3 hourly_data fetch_production.py"
